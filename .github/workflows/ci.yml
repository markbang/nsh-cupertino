name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.5.0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: what is in this commit
    runs-on: ubuntu-24.04
    outputs:
      demo: ${{ steps.check.outputs.demo }}
      theme: ${{ steps.check.outputs.theme }}
    steps:
      - uses: actions/checkout@v7
      # The scaffold commit has neither; the workflow stays valid there.
      - id: check
        run: |
          echo "demo=$([ -f examples/demo/nsh.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "theme=$([ -f src/bin/gen_theme.rs ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    name: fmt, clippy, tests, theme
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # QuickJS' bindings come from bindgen, which needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: check-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # `theme/` is generated: a token changed without regenerating it fails here.
      - if: needs.changes.outputs.theme == 'yes'
        run: cargo run --bin gen-theme -- --check

  demo:
    name: demo (check, headless tests)
    needs: changes
    if: needs.changes.outputs.demo == 'yes'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nsh
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demo/target
            target
          key: demo-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('examples/demo/Cargo.lock') }}
          restore-keys: demo-${{ runner.os }}-${{ env.NSH_VERSION }}-
      - name: Install nsh
        run: |
          [ -x ~/.nsh/bin/nsh ] || curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
        working-directory: .
      - run: nsh check
      - run: nsh test

  web:
    name: demo (web build, screenshots)
    needs: changes
    if: needs.changes.outputs.demo == 'yes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nsh
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demo/target
          key: web-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('examples/demo/Cargo.lock') }}
          restore-keys: web-${{ runner.os }}-${{ env.NSH_VERSION }}-
      - name: Install nsh
        run: |
          [ -x ~/.nsh/bin/nsh ] || curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      # The runner's image has Google Chrome, which `nsh test --target web` uses.
      # `docs/screenshots/` is not in the repository: the script makes it, the
      # test writes into it.
      # `tools/shots.sh` also packages the demo for `tools/glass-shots.mjs`, which
      # patches the runtime (the shader's uniform blocks, see docs/design-notes.md)
      # and drives Chrome over CDP, then runs the material's pixel checks.
      - name: Screenshots of every demo page
        run: tools/shots.sh
      - run: tools/check-screenshots.sh docs/screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error
      - name: Publish the screenshots to the screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tools/publish-shots.sh docs/screenshots
      - name: Package the web app
        working-directory: examples/demo
        run: nsh package App.tsx --target web -o "$RUNNER_TEMP/web"
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ runner.temp }}/web
          if-no-files-found: error

  site:
    name: site (check, tests, web build, headless checks)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nsh
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            site/target
          key: site-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('site/nsh.json', 'Cargo.toml') }}
          restore-keys: site-${{ runner.os }}-${{ env.NSH_VERSION }}-
      - name: Install nsh
        run: |
          [ -x ~/.nsh/bin/nsh ] || curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
        working-directory: .
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      # The site shows the crate's version and the docs' own prop tables: both
      # are generated, and a stale commit fails here.
      - run: node ../tools/site-version.mjs --check
      - run: node ../tools/site-api.mjs --check
      - run: nsh check
      - run: nsh test
      - name: Package the site for the web
        run: nsh package App.tsx --target web -o "$RUNNER_TEMP/out"
      # `nsh package` writes `<out>/<Name>/`; the site is served from a directory
      # named after its base path, so a URL under it resolves as GitHub Pages
      # resolves it.
      - name: Serve it under its base path
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/pages"
          shopt -s nullglob
          entries=("$RUNNER_TEMP"/out/*)
          if [ ${#entries[@]} -ne 1 ] || [ ! -d "${entries[0]}" ]; then
            echo "expected one directory in $RUNNER_TEMP/out, got: ${entries[*]}" >&2
            exit 1
          fi
          mv "${entries[0]}" "$RUNNER_TEMP/pages/nsh-cupertino"
          cd "$RUNNER_TEMP/pages"
          python3 -m http.server 4173 --bind 127.0.0.1 &
          for i in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:4173/nsh-cupertino/ && break
            sleep 0.2
          done
      # The runner's image has Google Chrome; `site-check` drives it over CDP:
      # both viewports, every deep link, the demos, the controls, the paint and
      # transfer numbers of a cold first load.
      - name: Check the published site in headless Chrome
        working-directory: .
        run: |
          node tools/site-check.mjs \
            --url http://127.0.0.1:4173/nsh-cupertino/ \
            --out "$RUNNER_TEMP/screens" \
            --chrome "$(command -v google-chrome || command -v google-chrome-stable)" \
            > "$RUNNER_TEMP/site-check.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/site-check.json
          if-no-files-found: warn
