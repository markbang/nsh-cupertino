name: Android UI

# The Liquid Glass pages, captured on an Android emulator: the material is a
# GPU shader (`docs/components/glass.md`), and an emulator is the only Android
# device CI has. `tools/android-glass-check.mjs` fails the run when a capture is
# blank (black or a single colour), and measures the calibration stills the way
# `tools/glass-pixels.mjs` measures the web ones: the edge under the capsule's
# rim must move, which a fill cannot do.
#
# Acceptance evidence, not a pull request gate: it runs nightly (03:17 UTC, on
# main), on a tag, by hand, and on a pull request labelled `android`.
#
# Known thin margin: the dark rim symmetry reads 0.0196 against the 0.02 limit
# here (light 0.0157; web 0.0000 / 0.0157). The soft sheen (specular × 0.055 ×
# along²) leans to the lit side. There is no room left: do not treat the limit
# as slack. See docs/design-notes.md, "What our renders measure".

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NSH_VERSION: v0.5.0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  # Nightly and manual runs save the caches; a labelled pull request reads
  # main's (and saves its own with the `deps` label too).
  WARM: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deps') }}

defaults:
  run:
    shell: bash

jobs:
  glass:
    name: glass on an emulator (light, dark, scrolled, capsules, sheet)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      # `d8` and `apksigner` need a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache: cargo-android
          lock: ${{ hashFiles('examples/demo/Cargo.lock') }}
          warm: ${{ env.WARM }}
          targets: |
            x86_64-linux-android
            aarch64-linux-android
      - name: Build the demo for Android
        working-directory: examples/demo
        run: |
          set -eu
          nsh package App.tsx --target android --abi x86_64 -o "$RUNNER_TEMP/x86_64"
          nsh package App.tsx --target android --abi arm64-v8a -o "$RUNNER_TEMP/arm64"
          ls -l "$RUNNER_TEMP"/x86_64 "$RUNNER_TEMP"/arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # SwiftShader renders the material in software: a GitHub runner has no
      # GPU, and the shader opens with wgpu's Vulkan or OpenGL backend.
      - name: Capture the glass pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # SwiftShader renders in software: more cores keep the system's own
          # processes from starving while the GPU work runs.
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -no-audio
            -no-boot-anim -camera-back none -camera-front none
          # The action runs each line in a shell of its own: keep the driver's
          # failure for the last line, and its log for the artifact.
          script: |
            LOGCAT="$RUNNER_TEMP/logcat.txt" tools/android-glass.sh "$RUNNER_TEMP/x86_64" docs/screenshots > "$RUNNER_TEMP/android-glass.log" 2>&1 || echo "the driver failed: $?" > "$RUNNER_TEMP/failed"
            cat "$RUNNER_TEMP/android-glass.log"
            [ ! -f "$RUNNER_TEMP/failed" ] || exit 1
      - name: Fail when a capture is blank, and measure the material
        run: node tools/android-glass-check.mjs --dir docs/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-glass
          path: |
            docs/screenshots/android-glass-*.png
            ${{ runner.temp }}/android-glass.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apk
          path: |
            ${{ runner.temp }}/x86_64/*.apk
            ${{ runner.temp }}/arm64/*.apk
          if-no-files-found: error
      - name: Publish the captures to the screenshots branch
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') || startsWith(github.ref, 'refs/tags/v')
        run: tools/publish-shots.sh docs/screenshots
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/save-caches
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          warm: ${{ env.WARM }}
