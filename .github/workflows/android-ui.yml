name: Android UI

# The Liquid Glass pages, captured on an Android emulator: the material is a
# GPU shader (`docs/components/glass.md`), and an emulator is the only Android
# device CI has. `tools/android-glass-check.mjs` fails the run when a capture is
# blank (black or a single colour), and measures the calibration stills the way
# `tools/glass-pixels.mjs` measures the web ones: the edge under the capsule's
# rim must move, which a fill cannot do.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/demo/**'
      - 'theme/**'
      - 'tools/**'
      - '.github/workflows/android-ui.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.5.0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

defaults:
  run:
    shell: bash

jobs:
  glass:
    name: glass on an emulator (light, dark, scrolled, capsules, sheet)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # QuickJS' bindings come from bindgen, which needs libclang; `d8` and
      # `apksigner` need a JDK.
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-linux-android
            aarch64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nsh
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demo/target
            target
          key: android-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('examples/demo/Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-${{ env.NSH_VERSION }}-
      - name: Install nsh
        run: |
          [ -x ~/.nsh/bin/nsh ] || curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Build the demo for Android
        working-directory: examples/demo
        run: |
          set -eu
          nsh package App.tsx --target android --abi x86_64 -o "$RUNNER_TEMP/x86_64"
          nsh package App.tsx --target android --abi arm64-v8a -o "$RUNNER_TEMP/arm64"
          ls -l "$RUNNER_TEMP"/x86_64 "$RUNNER_TEMP"/arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # SwiftShader renders the material in software: a GitHub runner has no
      # GPU, and the shader opens with wgpu's Vulkan or OpenGL backend.
      - name: Capture the glass pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # SwiftShader renders in software: more cores keep the system's own
          # processes from starving while the GPU work runs.
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -no-audio
            -no-boot-anim -camera-back none -camera-front none
          # The action runs each line in a shell of its own: keep the driver's
          # failure for the last line, and its log for the artifact.
          script: |
            LOGCAT="$RUNNER_TEMP/logcat.txt" tools/android-glass.sh "$RUNNER_TEMP/x86_64" docs/screenshots > "$RUNNER_TEMP/android-glass.log" 2>&1 || echo "the driver failed: $?" > "$RUNNER_TEMP/failed"
            cat "$RUNNER_TEMP/android-glass.log"
            [ ! -f "$RUNNER_TEMP/failed" ] || exit 1
      - name: Fail when a capture is blank, and measure the material
        run: node tools/android-glass-check.mjs --dir docs/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-glass
          path: |
            docs/screenshots/android-glass-*.png
            ${{ runner.temp }}/android-glass.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apk
          path: |
            ${{ runner.temp }}/x86_64/*.apk
            ${{ runner.temp }}/arm64/*.apk
          if-no-files-found: error
      - name: Publish the captures to the screenshots branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: tools/publish-shots.sh docs/screenshots
