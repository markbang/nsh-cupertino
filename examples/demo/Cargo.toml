[package]
name = "nsh-cupertino-demo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
nsh-cupertino = { path = "../.." }

# The web runtime's bindings; `nsh` runs the wasm-bindgen CLI of this version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
